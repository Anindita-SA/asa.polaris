name: Polaris Health Check

on:
  workflow_dispatch:

jobs:
  schema-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Schema Drift Check
        run: node scripts/schema_drift_check.js
