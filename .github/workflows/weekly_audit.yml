name: Weekly Polaris Audit

on:
  schedule:
    # Runs at 00:00 (midnight) every Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows you to run it manually from the GitHub UI

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        # Installs the supabase client locally for the script
        run: npm install @supabase/supabase-js

      - name: Run Weekly Audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/weekly_audit.js
